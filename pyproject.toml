[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-local-site-builder"
version = "0.1.0"
description = "From a local business's public facts to a previewable one-page site, on Kimi K3."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alfredo Lipari" }]
dependencies = ["openai>=1.50"]

[project.scripts]
sitekit = "sitekit.__main__:main"

[tool.setuptools]
packages = ["sitekit"]
